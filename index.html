<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e8eaf0;font-family:'Nunito',sans-serif;min-height:100vh}
input,select,button,textarea{font-family:'Nunito',sans-serif}
.page{display:none;padding:12px;max-width:900px;margin:0 auto}
.page.active{display:block}
header{background:#161b27;border-bottom:1px solid #2a2f3e;padding:0 10px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.logo{font-weight:800;font-size:14px;color:#60a5fa;letter-spacing:1px}
.nav{display:flex;gap:2px}
.nav-btn{background:transparent;color:#8892a0;border:none;border-radius:8px;padding:5px 7px;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1}
.nav-btn.active{background:#1e3a5f;color:#60a5fa}
.nav-btn span.icon{font-size:15px}
.logout-btn{background:#1e2433;border:none;color:#8892a0;border-radius:8px;padding:5px 8px;font-size:11px;cursor:pointer}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select{
  background:#0f1117;border:1px solid #2a2f3e;border-radius:8px;color:#e8eaf0;
  padding:9px 12px;font-size:13px;width:100%;outline:none}
.btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.btn-green{background:#166534}
.btn-dark{background:#1e2433}
.btn-red{background:#3b1515;color:#f87171}
.btn-blue{background:#1e3a5f}
.btn-sm{font-size:11px;padding:5px 10px}
.card{background:#161b27;border:1px solid #2a2f3e;border-radius:12px;padding:14px;margin-bottom:10px}
.card-green{border-color:#166534}
.section-title{font-weight:800;font-size:18px;color:#e8eaf0;margin-bottom:12px}
.label{color:#8892a0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;margin-top:4px}
.empty{color:#2a2f3e;text-align:center;padding:24px;font-size:13px}
.mono{font-family:'Courier New',monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.badge-blue{background:#1e3a5f;color:#60a5fa}
.badge-green{background:#0d2018;color:#22c55e}
.badge-red{background:#3b0f0f;color:#f87171}

.spinner{text-align:center;padding:40px;color:#4a5568;font-size:14px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:7px 8px;color:#4a5568;text-align:right;font-weight:600;background:#0f1117}
th:first-child{text-align:left}
td{padding:6px 8px;border-top:1px solid #1a1f2e;text-align:right;color:#c4cad8}
td:first-child{text-align:left;font-weight:600}
.row-filled{background:#0a1f12;border:1px solid #166534;border-radius:8px;padding:5px 6px;margin-bottom:5px;display:grid;gap:4px;align-items:center}
.row-empty{background:#0f1117;border:1px solid #1e2433;border-radius:8px;padding:5px 6px;margin-bottom:5px;display:grid;gap:4px;align-items:center}
.positions-grid{grid-template-columns:1fr 52px 86px 76px 26px}
/* MOBILE FIXES */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;-webkit-overflow-scrolling:touch}
input,select{font-size:16px!important;-webkit-appearance:none;border-radius:8px}
button{-webkit-appearance:none;border-radius:8px}
input[type=date],input[type=time]{font-size:14px!important}
.page{padding:10px}
header{padding:0 6px}
.nav-btn{padding:4px 5px;min-width:36px}
.nav-btn span.icon{font-size:16px}
.section-title{font-size:16px}
.stat-val{font-size:14px!important}
.mono{font-family:'Courier New',monospace}
*{max-width:100%;word-break:break-word;box-sizing:border-box}
.tag-btn{background:#1e2433;color:#8892a0;border:1px solid #2a2f3e;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;margin:3px}
.tag-btn.selected{background:#2563eb;color:#fff;border-color:#60a5fa}
.step-circle{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.step-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.step-label{font-weight:700;font-size:13px}
.pay-row{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;flex-wrap:wrap}
#login-page{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#161b27;border:1px solid #2a2f3e;border-radius:16px;padding:32px;width:90%;max-width:360px}
.login-logo{text-align:center;margin-bottom:24px}
.form-row{margin-bottom:8px}
.total-box{background:#0f1117;border:1px solid #2a2f3e;border-radius:10px;padding:12px 14px;margin-top:12px}

.stat-card{background:#161b27;border:1px solid #2a2f3e;border-radius:12px;padding:14px;text-align:center}

.account-row{background:#161b27;border:1px solid #2a2f3e;border-radius:10px;padding:10px 14px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div style="font-size:40px">⚙</div>

    <div style="margin-top:12px;color:#2a2f3e;font-size:11px;text-align:center">admin / zavodbuh@5574</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="main-app" style="display:none">
  <header>
    <div class="logo" style="font-size:12px;white-space:nowrap;flex-shrink:0">⚙ БУХ</div>
    <div class="nav" style="display:flex;gap:1px;overflow-x:auto;flex:1;justify-content:center">
      <button class="nav-btn active" onclick="showPage('dashboard')" id="nav-dashboard"><span class="icon">📊</span>Дашборд</button>
      <button class="nav-btn" onclick="showPage('orders')" id="nav-orders"><span class="icon">📋</span>Заказы</button>
      <button class="nav-btn" onclick="showPage('transactions')" id="nav-transactions"><span class="icon">💸</span>Деньги</button>
      <button class="nav-btn" onclick="showPage('stock')" id="nav-stock"><span class="icon">📦</span>Склад</button>
      <button class="nav-btn" onclick="showPage('debts')" id="nav-debts"><span class="icon">🤝</span>Долги</button>
      <button class="nav-btn" onclick="showPage('reports')" id="nav-reports"><span class="icon">📈</span>Отчёты</button>
    </div>
    <button class="logout-btn" onclick="doLogout()" id="user-name-btn" style="flex-shrink:0;white-space:nowrap;font-size:11px;padding:4px 6px">↩</button>
  </header>

  <div id="page-dashboard" class="page active"></div>
  <div id="page-orders" class="page"></div>
  <div id="page-transactions" class="page"></div>
  <div id="page-stock" class="page"></div>
  <div id="page-debts" class="page"></div>
  <div id="page-reports" class="page"></div>
</div>

<script>
// ============ FIREBASE ============
const firebaseConfig = {
  apiKey: "AIzaSyCY0KQPB7GFrE9b3W9hoZLhBHehJeRp5cM",
  authDomain: "zavod-buh.firebaseapp.com",
  projectId: "zavod-buh",
  storageBucket: "zavod-buh.firebasestorage.app",
  messagingSenderId: "254942758441",
  appId: "1:254942758441:web:09264bc5ce46b840fffe38"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ============ CONSTANTS ============
const USERS = [
  {id:1,name:"Администратор",login:"admin",password:"zavodbuh@5574",role:"admin"},
  {id:2,name:"Жоке",login:"Joke",password:"joke@1951",role:"viewer"},
  {id:3,name:"Садулла",login:"Sadulla",password:"140982",role:"viewer"},
  {id:4,name:"Ернур",login:"Ernur",password:"4001",role:"limited"},
];
const ACCOUNTS = [{id:"cash",name:"Наличка",group:"Касса"},{id:"kaspi",name:"Kaspi",group:"Касса"},{id:"rbk",name:"RBK Bank",group:"Касса"}];
const INCOME_CAT = ["Плиты перекрытия","Кольца","Крышка колодца","Лотки","ФБС блоки","Металлолом","КСЕЛЛ"];
const EXPENSE_CAT = ["Продукты","Арматура","Цемент","Щебень","Песок","Эл. Энергия","Зарплаты","Металл круг","ВР1","Произведённые расходы","Прочие расходы","Вязальная проволока","Электроды","Отрезные диски","Ремонт","Отработка","Миграция","Налоги","З/П за выходные дни"];
const DIVIDEND_CAT = ["Дивиденды Жоке","Дивиденды Сайфулла ака","Дивиденды Завод"];
const STOCK_ITEMS = ["Плиты перекрытия","Кольца","Крышка колодца","Лотки","ФБС блоки","Песок","Щебень","Цемент"];
const CAST_ITEMS = ["Плиты перекрытия","Кольца","Крышка колодца","Лотки","ФБС блоки"];

// ============ UTILS ============
const fmt = n => new Intl.NumberFormat("ru-KZ",{minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);
const fmtDate = d => d ? new Date(d).toLocaleDateString("ru-RU") : "—";
const today = () => new Date().toISOString().split("T")[0];
const nowTime = () => new Date().toTimeString().slice(0,5);
const genId = () => Math.random().toString(36).slice(2)+Date.now();
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// ============ STATE ============
let currentUser = null;
let currentPage = "dashboard";
let unsubs = [];
let data = {orders:[], transactions:[], stock:[], debts:[], warehouses:[], castings:[], defects:[], nextOrderNum:1};

// ============ AUTH ============
function doLogin() {
  const login = document.getElementById("login-input").value.trim();
  const pass = document.getElementById("pass-input").value;
  const u = USERS.find(x => x.login===login && x.password===pass);
  if (u) {
    currentUser = u;
    sessionStorage.setItem("buh_user", JSON.stringify(u));
    document.getElementById("login-page").style.display = "none";
    document.getElementById("main-app").style.display = "block";
    document.getElementById("user-name-btn").textContent = u.name.split(" ")[0]+" ↩";
    startListeners();
    showPage("dashboard");
  } else {
    const err = document.getElementById("login-error");
    err.textContent = "Неверный логин или пароль";
    err.style.display = "block";
  }
}
function updateNavVisibility() {
  if(!currentUser) return;
  const role = currentUser.role;
  const hiddenForLimited = ["nav-dashboard","nav-transactions","nav-debts","nav-reports"];
  if(role === "limited") {
    hiddenForLimited.forEach(id => {
      const el = document.getElementById(id);
      if(el) el.style.display = "none";
    });
  } else {
    hiddenForLimited.forEach(id => {
      const el = document.getElementById(id);
      if(el) el.style.display = "";
    });
  }
}

function doLogout() {
  sessionStorage.removeItem("buh_user");
  unsubs.forEach(u => u());
  unsubs = [];
  currentUser = null;
  document.getElementById("main-app").style.display = "none";
  document.getElementById("login-page").style.display = "flex";
  document.getElementById("login-input").value = "";
  document.getElementById("pass-input").value = "";
}

// ============ FIRESTORE LISTENERS ============
function startListeners() {
  unsubs.push(db.collection("orders").onSnapshot(snap => {
    data.orders = snap.docs.map(d => ({id:d.id,...d.data()}));
    if (currentPage === "dashboard") renderDashboard();
    if (currentPage === "orders") renderOrders();
    if (currentPage === "reports") renderReports();
  }));
  unsubs.push(db.collection("transactions").onSnapshot(snap => {
    data.transactions = snap.docs.map(d => ({id:d.id,...d.data()}));
    if (currentPage === "dashboard") renderDashboard();
    if (currentPage === "transactions") renderTransactions();
    if (currentPage === "reports") renderReports();
  }));
  unsubs.push(db.collection("stock").onSnapshot(snap => {
    data.stock = snap.docs.map(d => ({id:d.id,...d.data()}));
    if (currentPage === "stock") renderStock();
  }));
  unsubs.push(db.collection("debts").onSnapshot(snap => {
    data.debts = snap.docs.map(d => ({id:d.id,...d.data()}));
    if (currentPage === "debts") renderDebts();
  }));
  unsubs.push(db.collection("meta").doc("counters").onSnapshot(snap => {
    if (snap.exists) data.nextOrderNum = snap.data().nextOrderNum || 1;
  }));
  unsubs.push(db.collection("warehouses").onSnapshot(snap => {
    data.warehouses = snap.docs.map(d => ({id:d.id,...d.data()}));
    if (currentPage === "stock") renderStock();
  }));
  unsubs.push(db.collection("castings").onSnapshot(snap => {
    data.castings = snap.docs.map(d => ({id:d.id,...d.data()}));
    if (currentPage === "stock") renderStock();
  }));
  unsubs.push(db.collection("defects").onSnapshot(snap => {
    data.defects = snap.docs.map(d => ({id:d.id,...d.data()}));
    if (currentPage === "stock") renderStock();
  }));
}

function showPage(pg) {
  if(currentUser&&currentUser.role==="limited"&&!["orders","stock"].includes(pg)) pg="orders";
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  const pageEl = document.getElementById("page-"+pg);
  const navEl = document.getElementById("nav-"+pg);
  if(pageEl) pageEl.classList.add("active");
  if(navEl) navEl.classList.add("active");
  currentPage = pg;
  updateNavVisibility();
  if (pg==="dashboard") renderDashboard();
  if (pg==="orders") renderOrders();
  if (pg==="transactions") renderTransactions();
  if (pg==="stock") renderStock();
  if (pg==="debts") renderDebts();
  if (pg==="reports") renderReports();
  window.scrollTo(0,0);
}

function getOrderPaid(order) {
  return (order.payments||[]).reduce((s,p) => p.type==="Возврат" ? s-p.amount : s+p.amount, 0);
}

// ============ DASHBOARD ============
function renderDashboard() {
  const m = new Date().getMonth(), y = new Date().getFullYear();
  let income=0, expense=0, dividends=0;
  const bal = {cash:0,kaspi:0,rbk:0};
  data.transactions.forEach(t => {
    const d = new Date(t.date);
    if (d.getMonth()===m && d.getFullYear()===y) {
      if (t.type==="income") income+=t.amount;
      else if (t.type==="expense") expense+=t.amount;
      else if (t.type==="dividend") dividends+=t.amount;
    }
    if (t.type==="income") bal[t.account]=(bal[t.account]||0)+t.amount;
    else bal[t.account]=(bal[t.account]||0)-t.amount;
  });
  const profit = income-expense-dividends;
  const pending = data.orders.filter(o => getOrderPaid(o) < o.total);

  let html = `<div class="section-title">Дашборд</div>
  <div class="grid2" style="margin-bottom:10px">
    <div class="stat-card"><div style="font-size:18px">📈</div><div style="color:#8892a0;font-size:11px;margin-top:4px">Доходы (месяц)</div><div class="stat-val" style="color:#22c55e">${fmt(income)} ₸</div></div>
    <div class="stat-card"><div style="font-size:18px">📉</div><div style="color:#8892a0;font-size:11px;margin-top:4px">Расходы (месяц)</div><div class="stat-val" style="color:#f87171">${fmt(expense)} ₸</div></div>
    <div class="stat-card"><div style="font-size:18px">💎</div><div style="color:#8892a0;font-size:11px;margin-top:4px">Дивиденды (месяц)</div><div class="stat-val" style="color:#a78bfa">${fmt(dividends)} ₸</div></div>
    <div class="stat-card"><div style="font-size:18px">💰</div><div style="color:#8892a0;font-size:11px;margin-top:4px">Прибыль (месяц)</div><div class="stat-val" style="color:${profit<0?'#f87171':'#60a5fa'}">${fmt(profit)} ₸</div></div>
  </div>
  <div class="label">Остатки по счетам</div>`;
  ACCOUNTS.forEach(a => {
    const v = bal[a.id]||0;
    html += `<div class="account-row"><span style="color:#c4cad8">${a.group} / ${a.name}</span><span class="mono" style="font-weight:700;color:${v<0?'#f87171':'#60a5fa'}">${fmt(v)} ₸</span></div>`;
  });
  if (pending.length) {
    html += `<div class="label" style="margin-top:16px">⏳ Ожидают оплаты (${pending.length})</div>`;
    pending.slice(0,5).forEach(o => {
      const paid = getOrderPaid(o);
      html += `<div class="card" style="margin-bottom:8px">
        <div class="flex" style="justify-content:space-between"><span style="font-weight:700;font-size:13px">#${o.num} ${esc(o.client)}</span><span class="mono" style="color:#fbbf24;font-size:13px">-${fmt(o.total-paid)} ₸</span></div>
        <div style="color:#4a5568;font-size:11px;margin-top:2px">${o.shipDate?'Отгрузка: '+fmtDate(o.shipDate)+' · ':''}Итого: ${fmt(o.total)} ₸</div>
      </div>`;
    });
  }
  document.getElementById("page-dashboard").innerHTML = html;
}

// ============ ORDERS ============
let orderSearch = "";
let showOrderForm = false;
let editOrderId = null;
let orderFormData = {};
let orderFormStep = 0;
let showPaymentOrderId = null;
let payFormData = {type:"Аванс",amount:"",date:today(),time:nowTime(),editIdx:null};

function renderOrders() {
  const isAdmin = currentUser.role==="admin";
  let filtered = data.orders.filter(o =>
    esc(o.client).toLowerCase().includes(orderSearch.toLowerCase()) ||
    String(o.num).includes(orderSearch)
  ).sort((a,b) => b.num-a.num);

  let html = `<div class="flex" style="justify-content:space-between;margin-bottom:12px">
    <div class="section-title" style="margin-bottom:0">Заказы</div>
    ${isAdmin?'<button class="btn" onclick="startNewOrder()">+ Новый</button>':''}
  </div>
  <input type="text" placeholder="Поиск по клиенту или №" value="${esc(orderSearch)}" oninput="orderSearch=this.value;renderOrders()" style="margin-bottom:12px"/>`;

  if (showOrderForm) {
    html += renderOrderForm();
  }

  filtered.forEach(order => {
    const paid = getOrderPaid(order);
    const remaining = order.total - paid;
    const isOpen = showPaymentOrderId === order.id;
    html += `<div class="card ${remaining<=0?'card-green':''}" style="margin-bottom:10px;padding:0;overflow:hidden">
      <div style="padding:12px 14px">
        <div class="flex" style="justify-content:space-between;align-items:flex-start">
          <div><span style="color:#4a5568;font-size:11px">#${order.num}</span><span style="font-weight:700;font-size:15px;margin-left:8px">${esc(order.client)}</span>${order.withVat?'<span class="badge badge-blue" style="margin-left:6px">НДС</span>':''}</div>
          <div class="mono" style="font-weight:800;font-size:15px;color:${remaining<=0?'#22c55e':'#fbbf24'}">${fmt(order.total)} ₸</div>
        </div>
        <div style="color:#8892a0;font-size:11px;margin-top:4px">${esc(order.category)} · ${fmtDate(order.date)}${order.shipDate?' · Отгрузка: '+fmtDate(order.shipDate):''}</div>
        <div style="margin-top:6px;font-size:12px">
          <span style="color:#22c55e">Оплачено: ${fmt(paid)} ₸</span>
          ${remaining>0?`<span style="color:#f87171;margin-left:12px">Остаток: ${fmt(remaining)} ₸</span>`:'<span style="color:#22c55e;margin-left:12px">✓ Оплачен</span>'}
        </div>`;

    if ((order.lines||[]).length) {
      html += `<div style="margin-top:8px;background:#0f1117;border-radius:8px;overflow:hidden"><table>
        <thead><tr><th style="text-align:left">Наименование</th><th>Кол</th><th>Цена</th><th>Сумма</th></tr></thead><tbody>`;
      order.lines.forEach(l => {
        html += `<tr><td>${esc(l.name)}</td><td>${l.qty}</td><td class="mono">${fmt(l.price)}</td><td class="mono" style="color:#60a5fa">${fmt(l.qty*l.price)}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    }

    if ((order.payments||[]).length) {
      order.payments.forEach((p,i) => {
        html += `<div class="pay-row">
          <span class="badge ${p.type==='Возврат'?'badge-red':'badge-blue'}">${p.type}</span>
          <span class="mono" style="color:${p.type==='Возврат'?'#f87171':'#22c55e'}">${p.type==='Возврат'?'-':''}${fmt(p.amount)} ₸</span>
          <span style="color:#4a5568">${fmtDate(p.date)} ${p.time||''}</span>
          ${isAdmin?`<button onclick="editPayment('${order.id}',${i})" style="background:none;border:none;color:#60a5fa;cursor:pointer;font-size:12px;padding:0">✏</button>
          <button onclick="deletePayment('${order.id}',${i})" style="background:none;border:none;color:#f87171;cursor:pointer;font-size:12px;padding:0">✕</button>`:''}
        </div>`;
      });
    }

    html += `<div class="flex" style="margin-top:10px;flex-wrap:wrap">
      ${isAdmin?`<button class="btn btn-blue btn-sm" onclick="togglePayPanel('${order.id}')">💳 Оплата</button>
      <button class="btn btn-sm" style="background:#1a2a1a" onclick="editOrder('${order.id}')">✏ Изменить</button>
      <button class="btn btn-red btn-sm" onclick="delOrder('${order.id}')">🗑</button>`:''}
      <button class="btn btn-sm" style="background:#1a2533" onclick="printOrder('${order.id}')">🖨 Печать</button>
    </div></div>`;

    if (isOpen && isAdmin) {
      html += `<div class="payment-panel">
        <div class="label">${payFormData.editIdx!==null?'Редактировать оплату':'Добавить оплату'}</div>
        <div class="flex" style="margin-top:8px;flex-wrap:wrap">
          ${['Аванс','Остаток','Полная оплата','Возврат'].map(t=>`<button class="btn btn-sm ${payFormData.type===t?'':'btn-dark'}" onclick="setPayType('${t}')">${t}</button>`).join('')}
        </div>
        <div class="grid2" style="margin-top:8px">
          <input type="number" placeholder="Сумма ₸" value="${payFormData.amount}" oninput="payFormData.amount=this.value"/>
          <input type="date" value="${payFormData.date}" onchange="payFormData.date=this.value"/>
        </div>
        <input type="time" value="${payFormData.time}" onchange="payFormData.time=this.value" style="margin-top:8px"/>
        <div class="flex" style="margin-top:8px">
          <button class="btn btn-green" onclick="savePayment('${order.id}')">Сохранить</button>
          <button class="btn btn-dark" onclick="showPaymentOrderId=null;renderOrders()">Отмена</button>
        </div>
      </div>`;
    }
    html += `</div>`;
  });

  if (!filtered.length) html += `<div class="empty">Заказов нет</div>`;

  html += `<div style="position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(to top,#0f1117 80%,transparent);margin-top:8px">
    <button onclick="printAllOrders()" style="width:100%;padding:14px;font-size:15px;font-weight:700;background:#1e3a5f;color:#fff;border:none;border-radius:12px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,0.4)">
      🖨 Сохранить / Распечатать PDF
    </button>
  </div>`;
  document.getElementById("page-orders").innerHTML = html;
}

function renderOrderForm() {
  const f = orderFormData;
  const isEdit = !!editOrderId;
  const step = orderFormStep;
  const total = (f.lines||[]).reduce((s,l)=>s+(parseFloat(l.qty)||0)*(parseFloat(l.price)||0),0);

  const stepCircle = (n,done) => `<div class="step-circle" style="background:${step===n?'#2563eb':done?'#166534':'#1e2433'}">${done&&step!==n?'✓':n+1}</div>`;
  const stepLbl = (n,label,done) => `<div class="step-row">${stepCircle(n,done)}<span class="step-label" style="color:${step===n?'#e8eaf0':done?'#22c55e':'#4a5568'}">${label}</span></div>`;

  let html = `<div class="card" style="border-color:#2563eb;margin-bottom:14px">
    <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:16px">
      <span style="font-weight:800;font-size:15px;color:#60a5fa">${isEdit?'✏ Заказ #'+f.num:'📋 Новый заказ #'+f.num}</span>
      <div class="flex" style="gap:6px">
        <button class="btn btn-sm ${f.withVat?'':'btn-dark'}" onclick="orderFormData.withVat=true;renderOrders()">С НДС</button>
        <button class="btn btn-sm ${!f.withVat?'':'btn-dark'}" onclick="orderFormData.withVat=false;renderOrders()">Без НДС</button>
      </div>
    </div>`;

  // STEP 0 — CLIENT
  html += stepLbl(0,"Клиент и даты",f.client&&f.client.trim().length>0);
  if (step===0||isEdit) {
    html += `<div style="padding-left:32px">
      <div style="color:#4a5568;font-size:11px;margin-bottom:4px">Имя клиента *</div>
      <input type="text" value="${esc(f.client||'')}" oninput="orderFormData.client=this.value" placeholder="Например: Бахтияр" style="margin-bottom:10px"/>
      <div class="grid2" style="margin-bottom:10px">
        <div><div style="color:#4a5568;font-size:11px;margin-bottom:4px">Дата заказа</div><input type="date" value="${f.date||today()}" onchange="orderFormData.date=this.value"/></div>
        <div><div style="color:#4a5568;font-size:11px;margin-bottom:4px">Срок отгрузки</div><input type="date" value="${f.shipDate||''}" onchange="orderFormData.shipDate=this.value"/></div>
      </div>
      ${!isEdit?`<button class="btn" onclick="orderStep1()">Далее → Выбрать категорию</button>`:''}
    </div>`;
  }

  // STEP 1 — CATEGORY
  if (step>=1||isEdit) {
    html += stepLbl(1,"Категория",f.category&&f.category.length>0);
    html += `<div style="padding-left:32px"><div style="color:#4a5568;font-size:11px;margin-bottom:8px">Выберите категорию *</div><div style="display:flex;flex-wrap:wrap">`;
    INCOME_CAT.forEach(cat => {
      html += `<button class="tag-btn ${f.category===cat?'selected':''}" onclick="selectOrderCat('${cat}')">${cat}</button>`;
    });
    html += `</div>`;
    if (f.category) {
      html += `<div style="margin-top:8px;color:#22c55e;font-size:12px">✓ Выбрано: <b>${esc(f.category)}</b>`;
      if (!isEdit&&step===1) html += `<button class="btn btn-sm" style="margin-left:12px" onclick="orderFormStep=2;renderOrders()">Далее → Позиции</button>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  // STEP 2 — LINES
  if (step>=2||isEdit) {
    html += stepLbl(2,"Позиции",total>0);
    html += `<div style="display:grid;grid-template-columns:1fr 52px 86px 76px 26px;gap:4px;margin-bottom:4px;padding:0 2px">
      <div style="color:#4a5568;font-size:10px;font-weight:700;text-transform:uppercase">Наименование</div>
      <div style="color:#4a5568;font-size:10px;font-weight:700;text-align:center">Кол.</div>
      <div style="color:#4a5568;font-size:10px;font-weight:700;text-align:right">Цена ₸</div>
      <div style="color:#4a5568;font-size:10px;font-weight:700;text-align:right">Сумма</div>
      <div></div>
    </div>`;
    (f.lines||[]).forEach((l,i) => {
      const sum=(parseFloat(l.qty)||0)*(parseFloat(l.price)||0);
      const filled=l.name&&l.qty&&l.price&&sum>0;
      html += `<div style="display:grid;grid-template-columns:1fr 52px 86px 76px 26px;gap:4px;margin-bottom:5px;background:${filled?'#0a1f12':'#0f1117'};border:1px solid ${filled?'#166534':'#1e2433'};border-radius:8px;padding:5px 6px;align-items:center">
        <input type="text" value="${esc(l.name||'')}" oninput="orderFormData.lines[${i}].name=this.value;updateOrderTotal()" placeholder="Позиция ${i+1}" style="background:transparent;border:none;padding:5px 8px;font-size:12px"/>
        <input type="number" value="${l.qty||''}" oninput="orderFormData.lines[${i}].qty=this.value;updateOrderTotal()" placeholder="0" style="background:transparent;border:none;padding:5px 4px;font-size:12px;text-align:center"/>
        <input type="number" value="${l.price||''}" oninput="orderFormData.lines[${i}].price=this.value;updateOrderTotal()" placeholder="0" style="background:transparent;border:none;padding:5px 6px;font-size:12px;text-align:right"/>
        <div style="text-align:right;font-family:'Courier New',monospace;font-size:12px;color:${sum>0?'#22c55e':'#2a2f3e'};padding:0 4px">${sum>0?fmt(sum):'—'}</div>
        <button onclick="removeLine(${i})" style="background:none;border:none;color:#4a5568;cursor:pointer;font-size:15px;padding:0;text-align:center">✕</button>
      </div>`;
    });
    if ((f.lines||[]).length<50) {
      html += `<button class="btn btn-dark" style="width:100%;margin-top:4px;padding:10px;border:1px dashed #2a2f3e" onclick="addLine()">+ Добавить позицию</button>`;
    }
    if (total>0) {
      html += `<div class="total-box"><div class="flex" style="justify-content:space-between;align-items:center">
        <span style="color:#8892a0;font-size:13px">Итого:</span>
        <span class="mono" style="font-weight:800;color:#60a5fa;font-size:18px">${fmt(total)} ₸</span>
      </div>`;
      if (f.withVat) html += `<div class="flex" style="justify-content:space-between;margin-top:5px"><span style="color:#4a5568;font-size:12px">в т.ч. НДС 16%:</span><span class="mono" style="color:#4a5568;font-size:12px">${fmt(total-total/1.16)} ₸</span></div>`;
      html += `</div>`;
    }
  }

  html += `<div class="flex" style="margin-top:16px">
    <button class="btn btn-green" style="flex:1;font-size:14px" onclick="saveOrder()">💾 Сохранить заказ</button>
    <button class="btn btn-dark" onclick="cancelOrderForm()">Отмена</button>
  </div></div>`;
  return html;
}

function orderStep1() {
  if (!orderFormData.client||!orderFormData.client.trim()) { alert("Введите имя клиента"); return; }
  orderFormStep=1; renderOrders();
}
function selectOrderCat(cat) {
  orderFormData.category=cat;
  if (orderFormStep===1) orderFormStep=2;
  renderOrders();
}
function addLine() { orderFormData.lines.push({name:"",qty:"",price:""}); renderOrders(); }
function removeLine(i) { orderFormData.lines.splice(i,1); renderOrders(); }
function updateOrderTotal() {
  // Just re-renders total display inline without full re-render
  const total = orderFormData.lines.reduce((s,l)=>s+(parseFloat(l.qty)||0)*(parseFloat(l.price)||0),0);
}
function startNewOrder() {
  editOrderId=null;
  orderFormStep=0;
  orderFormData={id:genId(),num:data.nextOrderNum,client:"",date:today(),shipDate:"",category:"",withVat:true,lines:[{name:"",qty:"",price:""}],payments:[]};
  showOrderForm=true;
  renderOrders();
}
function editOrder(id) {
  const o = data.orders.find(x=>x.id===id);
  if (!o) return;
  editOrderId=id;
  orderFormStep=2;
  orderFormData=JSON.parse(JSON.stringify(o));
  showOrderForm=true;
  renderOrders();
}
function cancelOrderForm() { showOrderForm=false; editOrderId=null; renderOrders(); }
async function saveOrder() {
  const f = orderFormData;
  if (!f.client||!f.client.trim()) { alert("Укажите клиента"); return; }
  if (!f.category) { alert("Выберите категорию"); return; }
  const total = (f.lines||[]).reduce((s,l)=>s+(parseFloat(l.qty)||0)*(parseFloat(l.price)||0),0);
  if (total<=0) { alert("Добавьте хотя бы одну позицию с суммой"); return; }
  f.total = total;
  try {
    await db.collection("orders").doc(f.id).set(f);
    if (!editOrderId) await db.collection("meta").doc("counters").set({nextOrderNum:(data.nextOrderNum||1)+1},{merge:true});
    showOrderForm=false; editOrderId=null; renderOrders();
  } catch(e) { alert("Ошибка сохранения: "+e.message); }
}
async function delOrder(id) {
  if (!confirm("Удалить заказ?")) return;
  await db.collection("orders").doc(id).delete();
}
function togglePayPanel(id) {
  showPaymentOrderId = showPaymentOrderId===id ? null : id;
  payFormData={type:"Аванс",amount:"",date:today(),time:nowTime(),editIdx:null};
  renderOrders();
}
function setPayType(t) { payFormData.type=t; renderOrders(); }
function editPayment(orderId,idx) {
  const o = data.orders.find(x=>x.id===orderId);
  const p = o.payments[idx];
  payFormData={type:p.type,amount:String(p.amount),date:p.date,time:p.time||nowTime(),editIdx:idx};
  showPaymentOrderId=orderId;
  renderOrders();
}
async function deletePayment(orderId,idx) {
  if (!confirm("Удалить оплату?")) return;
  const o = data.orders.find(x=>x.id===orderId);
  const payments = o.payments.filter((_,i)=>i!==idx);
  await db.collection("orders").doc(orderId).update({payments});
}
async function savePayment(orderId) {
  const amount = parseFloat(payFormData.amount);
  if (!amount||amount<=0) { alert("Введите сумму"); return; }
  const o = data.orders.find(x=>x.id===orderId);
  if (payFormData.type==="Возврат") {
    const editingIdx = payFormData.editIdx;
    const other = (o.payments||[]).filter((_,i)=>i!==editingIdx);
    const totalPaid = other.reduce((s,p)=>p.type==="Возврат"?s-p.amount:s+p.amount,0);
    if (amount>totalPaid) { alert("Сумма возврата превышает оплаченную сумму ("+fmt(totalPaid)+" ₸)"); return; }
  }
  const payment={type:payFormData.type,amount,date:payFormData.date,time:payFormData.time};
  let payments=[...(o.payments||[])];
  if (payFormData.editIdx!==null) payments[payFormData.editIdx]=payment;
  else payments.push(payment);
  await db.collection("orders").doc(orderId).update({payments});
  showPaymentOrderId=null;
  payFormData={type:"Аванс",amount:"",date:today(),time:nowTime(),editIdx:null};
}
function printAllOrders() {
  const orders = [...data.orders].sort((a,b)=>b.num-a.num);
  if(!orders.length){alert("Заказов нет");return;}
  let rows = "";
  orders.forEach(o=>{
    const paid=getOrderPaid(o), remaining=o.total-paid;
    rows+=`<tr>
      <td>${o.num}</td>
      <td>${o.client}</td>
      <td>${fmtDate(o.date)}</td>
      <td>${o.category}</td>
      <td align="right">${fmt(o.total)} ₸</td>
      <td align="right" style="color:green">${fmt(paid)} ₸</td>
      <td align="right" style="color:${remaining>0?'red':'green'}">${fmt(remaining)} ₸</td>
      <td>${o.withVat?"С НДС":"Без НДС"}</td>
      <td>${remaining<=0?"✓ Оплачен":"Ожидает"}</td>
    </tr>`;
  });
  const totalSum=orders.reduce((s,o)=>s+o.total,0);
  const totalPaid=orders.reduce((s,o)=>s+getOrderPaid(o),0);
  const totalRemain=totalSum-totalPaid;
  const html=`<html><head><title>Все заказы</title>
  <style>body{font-family:Arial;padding:20px;font-size:12px}h1{font-size:18px}
  table{width:100%;border-collapse:collapse}th{background:#f0f4ff;padding:6px 8px;text-align:left;border:1px solid #ddd;font-size:11px}
  td{padding:6px 8px;border:1px solid #ddd}tr:nth-child(even){background:#fafafa}
  .total{font-weight:bold;font-size:14px;margin-top:12px}
  .footer{margin-top:20px;color:#aaa;font-size:11px;border-top:1px solid #eee;padding-top:8px}</style></head>
  <body><h1>⚙ ЗАВОД БУХ — Все заказы</h1>
  <p style="color:#888;font-size:12px">Дата: ${new Date().toLocaleDateString("ru-RU")}</p>
  <table><thead><tr><th>#</th><th>Клиент</th><th>Дата</th><th>Категория</th><th>Итого</th><th>Оплачено</th><th>Остаток</th><th>НДС</th><th>Статус</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <div class="total">Итого заказов: ${orders.length} шт. | Сумма: ${fmt(totalSum)} ₸ | Оплачено: ${fmt(totalPaid)} ₸ | Остаток: ${fmt(totalRemain)} ₸</div>
  <div class="footer">Сформировано: ${new Date().toLocaleDateString("ru-RU")} ${new Date().toLocaleTimeString("ru-RU")}</div>
  </body></html>`;
  const w=window.open("","_blank");w.document.write(html);w.document.close();setTimeout(()=>w.print(),500);
}

function printOrder(id) {
  const order = data.orders.find(x=>x.id===id);
  const paid=getOrderPaid(order), remaining=order.total-paid;
  const rows=(order.lines||[]).map(l=>`<tr><td>${l.name}</td><td align="center">${l.qty}</td><td align="right">${fmt(l.price)}</td><td align="right">${fmt(l.qty*l.price)}</td></tr>`).join("");

  <body><h2>Заказ №${order.num}</h2>
  <p>Клиент: <b>${order.client}</b> &nbsp; Дата: <b>${fmtDate(order.date)}</b></p>
  <p>Категория: <b>${order.category}</b> &nbsp; ${order.withVat?"С НДС (16%)":"Без НДС"}</p>
  ${order.shipDate?`<p>Срок отгрузки: <b>${fmtDate(order.shipDate)}</b></p>`:""}
  <table><thead><tr><th>Наименование</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr></thead><tbody>${rows}</tbody></table><br/>
  <p class="total">Итого: ${fmt(order.total)} ₸</p>
  ${order.withVat?`<p>НДС (16%): <b>${fmt(order.total-order.total/1.16)} ₸</b></p>`:""}
  <p>Оплачено: ${fmt(paid)} ₸</p><p class="total">Остаток: ${fmt(remaining)} ₸</p>
  ${(order.payments||[]).map(p=>`<p>${p.type}: ${p.type==="Возврат"?"-":""}${fmt(p.amount)} ₸ — ${fmtDate(p.date)} ${p.time||""}</p>`).join("")}

  const w=window.open("","_blank"); w.document.write(html); w.document.close(); setTimeout(()=>w.print(),500);

      </select>
      <select onchange="txFormData.category=this.value" style="margin-bottom:8px">
        ${catOptions.map(c=>`<option ${txFormData.category===c?"selected":""}>${c}</option>`).join("")}

function printTransactions(){
  const filtered=data.transactions.filter(t=>{
    if(txFilter.type!=="all"&&t.type!==txFilter.type)return false;
    if(txFilter.account!=="all"&&t.account!==txFilter.account)return false;
    if(txFilter.from&&t.date<txFilter.from)return false;
    if(txFilter.to&&t.date>txFilter.to)return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
  if(!filtered.length){alert("Нет данных для печати");return;}
  const typeLabels={income:"Доход",expense:"Расход",dividend:"Дивиденд"};
  let income=0,expense=0,dividend=0;
  const rows=filtered.map(t=>{
    if(t.type==="income")income+=t.amount;
    else if(t.type==="expense")expense+=t.amount;
    else dividend+=t.amount;
    return`<tr><td>${fmtDate(t.date)}</td><td>${typeLabels[t.type]}</td><td>${t.category}</td><td>${ACCOUNTS.find(a=>a.id===t.account)?.name||t.account}</td><td align="right" style="font-weight:bold;color:${t.type==="income"?"green":t.type==="expense"?"red":"purple"}">${t.type==="income"?"+":"-"}${fmt(t.amount)} ₸</td><td>${t.note||"-"}</td></tr>`;
  }).join("");
  const html=`<html><head><title>Транзакции</title>
  <style>body{font-family:Arial;padding:20px;font-size:12px}h1{font-size:18px}
  table{width:100%;border-collapse:collapse}th{background:#f0f4ff;padding:6px 8px;text-align:left;border:1px solid #ddd}
  td{padding:6px 8px;border:1px solid #ddd}tr:nth-child(even){background:#fafafa}
  .summary{margin:12px 0;font-size:13px}
  .footer{margin-top:20px;color:#aaa;font-size:11px;border-top:1px solid #eee;padding-top:8px}</style></head>
  <body><h1>⚙ ЗАВОД БУХ — Транзакции</h1>
  <p style="color:#888;font-size:12px">Дата: ${new Date().toLocaleDateString("ru-RU")}</p>
  <div class="summary">
    <span style="color:green">Доходы: ${fmt(income)} ₸</span> &nbsp;|&nbsp;
    <span style="color:red">Расходы: ${fmt(expense)} ₸</span> &nbsp;|&nbsp;
    <span style="color:purple">Дивиденды: ${fmt(dividend)} ₸</span> &nbsp;|&nbsp;
    <b>Чистый поток: ${fmt(income-expense-dividend)} ₸</b>
  </div>
  <table><thead><tr><th>Дата</th><th>Тип</th><th>Категория</th><th>Счёт</th><th>Сумма</th><th>Примечание</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <div class="footer">Сформировано: ${new Date().toLocaleDateString("ru-RU")} ${new Date().toLocaleTimeString("ru-RU")}</div>
  </body></html>`;
  const w=window.open("","_blank");w.document.write(html);w.document.close();setTimeout(()=>w.print(),500);
}
function startNewTx(){txFormData={type:"income",account:"cash",category:INCOME_CAT[0],amount:"",date:today(),note:""};editTxId=null;showTxForm=true;renderTransactions();}
function setTxType(t){txFormData.type=t;txFormData.category=t==="income"?INCOME_CAT[0]:t==="expense"?EXPENSE_CAT[0]:DIVIDEND_CAT[0];renderTransactions();}
function editTx(id){const t=data.transactions.find(x=>x.id===id);if(!t)return;txFormData={...t,amount:String(t.amount)};editTxId=id;showTxForm=true;renderTransactions();}
async function saveTx(){
  if(!txFormData.amount||parseFloat(txFormData.amount)<=0){alert("Введите сумму");return;}
  const tx={...txFormData,amount:parseFloat(txFormData.amount)};
  delete tx.id;
  try{
    if(editTxId)await db.collection("transactions").doc(editTxId).set(tx);
    else await db.collection("transactions").add(tx);
    showTxForm=false;editTxId=null;
  }catch(e){alert("Ошибка: "+e.message);}
}
async function delTx(id){if(!confirm("Удалить?"))return;await db.collection("transactions").doc(id).delete();}

function renderStock(){
  try {
    if(!currentUser) return;
    const isAdmin = currentUser.role==="admin";
    const canEdit = currentUser.role==="admin" || currentUser.role==="limited";

    // Compute main stock balance
    const mainBal={};
    STOCK_ITEMS.forEach(i=>mainBal[i]={produced:0,shipped:0,balance:0});
    (data.stock||[]).forEach(m=>{
      if(!mainBal[m.item]) mainBal[m.item]={produced:0,shipped:0,balance:0};
      if(m.type==="produced"){mainBal[m.item].produced+=m.qty;mainBal[m.item].balance+=m.qty;}
      else if(m.type==="shipped"){mainBal[m.item].shipped+=m.qty;mainBal[m.item].balance-=m.qty;}
      else if(m.type==="received") mainBal[m.item].balance+=m.qty;
      else if(m.type==="used") mainBal[m.item].balance-=m.qty;
    });
    // Add castings → counted as "produced" in main stock
    (data.castings||[]).forEach(c=>{
      const key = c.category||c.item||"";
      if(mainBal[key]!==undefined){
        mainBal[key].produced += c.qty;
        mainBal[key].balance  += c.qty;
      }
    });

    // Compute combined balance
    const combinedBal={};
    STOCK_ITEMS.forEach(i=>combinedBal[i]={produced:0,shipped:0,balance:0});
    STOCK_ITEMS.forEach(i=>{
      combinedBal[i].produced += mainBal[i].produced;
      combinedBal[i].shipped += mainBal[i].shipped;
      combinedBal[i].balance += mainBal[i].balance;

    (data.warehouses||[]).forEach(wh=>{
      (wh.items||[]).forEach(wi=>{

  } catch(e) {

}

async function saveDefect(){
  if(!defectFormData.category){alert("Выберите категорию");return;}
  const validLines=defectFormData.lines.filter(l=>l.name&&l.name.trim()&&parseFloat(l.qty)>0);
  if(!validLines.length){alert("Добавьте хотя бы одну позицию с количеством");return;}
  try{
    for(const l of validLines){
      await db.collection("defects").add({
        date:defectFormData.date,
        category:defectFormData.category,
        name:l.name.trim(),
        qty:parseFloat(l.qty),
        createdAt:Date.now(),
        createdBy:currentUser.name
      });
    }
    defectFormData={date:today(),category:"",lines:[{name:"",qty:""}]};
    defectFormStep=0;
    showDefectForm=false;
  }catch(e){alert("Ошибка: "+e.message);}
}

function defectAddLine(){
  if(defectFormData.lines.length>=100)return;
  defectFormData.lines.push({name:"",qty:""});
  renderStock();
}
function defectRemoveLine(i){
  defectFormData.lines.splice(i,1);
  if(!defectFormData.lines.length) defectFormData.lines.push({name:"",qty:""});
  renderStock();
}

function startEditDefectGroup(date, category){
  const records = (data.defects||[]).filter(c=>(c.category||c.item)===category && c.date===date);
  defectFormData = {
    date: date,
    category: category,
    lines: records.map(c=>({name:c.name||c.item||"",qty:String(c.qty),id:c.id}))
  };
  if(!defectFormData.lines.length) defectFormData.lines.push({name:"",qty:""});
  defectFormStep = 2;
  editDefectGroup = {date, category, ids: records.map(c=>c.id)};
  showDefectForm = true;
  renderStock();
}

async function saveDefectEdit(){
  if(!editDefectGroup) { saveDefect(); return; }
  const validLines = defectFormData.lines.filter(l=>l.name&&l.name.trim()&&parseFloat(l.qty)>0);
  if(!validLines.length){alert("Добавьте хотя бы одну позицию");return;}
  try{
    for(const id of editDefectGroup.ids){
      await db.collection("defects").doc(id).delete();
    }
    for(const l of validLines){
      await db.collection("defects").add({
        date: defectFormData.date,
        category: defectFormData.category,
        name: l.name.trim(),
        qty: parseFloat(l.qty),
        createdAt: Date.now(),
        createdBy: currentUser.name
      });
    }
    defectFormData={date:today(),category:"",lines:[{name:"",qty:""}]};
    defectFormStep=0; showDefectForm=false; editDefectGroup=null;
  }catch(e){alert("Ошибка: "+e.message);}
}

async function deleteDefect(id){
  if(!confirm("Удалить запись о браке?"))return;
  await db.collection("defects").doc(id).delete();
}

    grouped[c.date][cat].push(c);

  // Totals — only for categories that have data
  const totals={};

    td{padding:6px 10px;border:1px solid #eee}
    .footer{margin-top:24px;color:#aaa;font-size:11px;border-top:1px solid #eee;padding-top:10px}
    @media print{button{display:none}}
  </style></head>
  <body>
  <h1>⚙ ЗАВОД БУХ — Залитые изделия</h1>
  <p style="color:#888;font-size:12px">Дата формирования: ${new Date().toLocaleDateString("ru-RU")}</p>
  <h2>По датам</h2>
  <table>
    <thead><tr><th>Дата</th><th>Категория / Позиция</th><th style="text-align:right">Кол-во (шт)</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="3" style="text-align:center;color:#999">Нет данных</td></tr>'}</tbody>
  </table>
  <h2>Итого залито</h2>
  <table>
    <thead><tr><th>Категория</th><th style="text-align:right">Итого (шт)</th></tr></thead>

function printStockReport(whId){
  let title,rows="",bal={};
  STOCK_ITEMS.forEach(i=>bal[i]={produced:0,shipped:0,balance:0});

  if(whId==="combined"){
    title="Общие остатки (все склады)";
    data.stock.forEach(m=>{
      if(m.type==="produced"){bal[m.item].produced+=m.qty;bal[m.item].balance+=m.qty;}
      else if(m.type==="shipped"){bal[m.item].shipped+=m.qty;bal[m.item].balance-=m.qty;}
      else if(m.type==="received")bal[m.item].balance+=m.qty;
      else if(m.type==="used")bal[m.item].balance-=m.qty;
    });
    data.warehouses.forEach(wh=>{
      (wh.items||[]).forEach(wi=>{if(!bal[wi.item])bal[wi.item]={produced:0,shipped:0,balance:0};bal[wi.item].balance+=wi.qty;});
    });
  } else if(whId==="main"){
    title="Текущий склад";
    data.stock.forEach(m=>{
      if(m.type==="produced"){bal[m.item].produced+=m.qty;bal[m.item].balance+=m.qty;}
      else if(m.type==="shipped"){bal[m.item].shipped+=m.qty;bal[m.item].balance-=m.qty;}
      else if(m.type==="received")bal[m.item].balance+=m.qty;

  });
  rows+=`</table>`;

  const html=`<html><head><title>Склад — ${title}</title>
  <style>body{font-family:Arial;padding:24px;font-size:13px}h1{font-size:18px;margin-bottom:4px}

  td{padding:8px;border:1px solid #ddd}tr:nth-child(even){background:#fafafa}
  .footer{margin-top:24px;color:#aaa;font-size:11px;border-top:1px solid #eee;padding-top:10px}</style></head>

  <div class="period">Дата формирования: ${new Date().toLocaleDateString("ru-RU")}</div>
  ${rows}
  <div class="footer">Сформировано: ${new Date().toLocaleDateString("ru-RU")} ${new Date().toLocaleTimeString("ru-RU")}</div>

let reportType="cashflow";

    byCat[t.category][t.type]+=t.amount;

  const byMonth={};
  data.transactions.forEach(t=>{const k=t.date.slice(0,7);if(!byMonth[k])byMonth[k]={income:0,expense:0,dividend:0};if(t.type==="income")byMonth[k].income+=t.amount;else if(t.type==="expense")byMonth[k].expense+=t.amount;else byMonth[k].dividend+=t.amount;});
  const rbkIncome=filtered.filter(t=>t.type==="income"&&t.account==="rbk").reduce((s,t)=>s+t.amount,0);
  const profit=income-expense-dividend;
  const reports=["cashflow","pnl","balance","categories","monthly","vat","stock_main","stock_combined"];

    </div>`;

      html+=`<div style="padding:12px 16px;border-bottom:1px solid #1a1f2e;display:flex;justify-content:space-between"><span style="color:#c4cad8;font-size:13px">${l}</span><span class="mono" style="font-weight:700;color:${c};font-size:14px">${fmt(v)} ₸</span></div>`;

      </div></div>`;
    });

  }
  if(reportType==="monthly"){
    Object.entries(byMonth).sort(([a],[b])=>a.localeCompare(b)).forEach(([month,d])=>{
      const p=d.income-d.expense-d.dividend;
      html+=`<div class="card" style="margin-bottom:8px"><div style="font-weight:700;margin-bottom:6px;font-size:13px">${new Date(month+"-01").toLocaleDateString("ru-RU",{month:"long",year:"numeric"})}</div>

      </div></div>`;
    });

  }
  if(reportType==="stock_main"||reportType==="stock_combined"){
    const whId=reportType==="stock_main"?"main":"combined";
    html+=`<div style="text-align:center;padding:20px">
      <div style="color:#8892a0;margin-bottom:16px;font-size:13px">${reportType==="stock_main"?"Остатки текущего склада":"Общие остатки всех складов"}</div>

  if(reportType==="vat"){
    html+=`<div class="label">НДС отчёт (RBK Bank)</div><div class="card" style="padding:0;overflow:hidden">`;

  html += `<div style="position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(to top,#0f1117 80%,transparent);margin-top:8px">

      🖨 Сохранить / Распечатать PDF
    </button>
  </div>`;
  document.getElementById("page-reports").innerHTML=html;
}
